name: Update WYND recovery statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-wynd-recovery-stats.yml"
      - "scripts/update_wynd_recovery_stats.py"
      - "scripts/test_wynd_recovery_stats.py"
      - "data/recovery/wynd-pools.json"

permissions:
  contents: write
  pages: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test parser and collect confirmed tagged transactions
        shell: bash
        run: |
          mkdir -p docs/diagnostics
          set -o pipefail
          { python scripts/test_wynd_recovery_stats.py && python scripts/update_wynd_recovery_stats.py --root .; } 2>&1 | tee docs/diagnostics/latest_wynd_recovery_stats_test.log
      - name: Persist statistics and test evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recovery/recovery-events.json data/recovery/recovery-stats.json docs/diagnostics/latest_wynd_recovery_stats_test.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record recovery statistics tests"
          git push
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ github.token }}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
