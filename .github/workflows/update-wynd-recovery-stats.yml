name: Update WYND recovery statistics

on:
  workflow_dispatch:
  push:
    branches: [diagnostic/wynd-recovery-discovery]
    paths:
      - ".github/workflows/update-wynd-recovery-stats.yml"
      - "scripts/update_wynd_recovery_stats.py"
      - "scripts/test_wynd_recovery_stats.py"
      - "data/recovery/wynd-pools.json"

permissions:
  contents: write

jobs:
  validate-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Test parser and registry
        shell: bash
        run: |
          mkdir -p docs/diagnostics
          set -o pipefail
          { python scripts/test_wynd_recovery_stats.py && python scripts/update_wynd_recovery_stats.py --root . --dry-run; } 2>&1 | tee docs/diagnostics/latest_wynd_recovery_stats_test.log
      - name: Persist test evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/latest_wynd_recovery_stats_test.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record recovery statistics tests"
          git push
