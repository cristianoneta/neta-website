name: Monitor production data freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: read

concurrency:
  group: monitor-production-data-freshness
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify production worker freshness
        shell: bash
        run: |
          set -o pipefail
          python scripts/check_data_freshness.py --root . | tee "$GITHUB_STEP_SUMMARY"
