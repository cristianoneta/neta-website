name: Update WYND recovery market data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-wynd-recovery-market.yml"
      - "scripts/update_wynd_recovery_market.py"
      - "scripts/update_wynd_recovery_leaderboard.py"
      - "scripts/validate_wynd_recovery_snapshots.py"
      - "scripts/test_wynd_recovery_market.py"
      - "scripts/test_wynd_recovery_leaderboard.py"
      - "scripts/test_wynd_recovery_snapshots.py"
      - "data/recovery/wynd-pools.json"

permissions:
  contents: write
  pages: write

concurrency:
  group: neta-repository-writer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=scripts python scripts/test_neta_core.py
      - run: PYTHONPATH=scripts python scripts/test_wynd_recovery_market.py
      - run: PYTHONPATH=scripts python scripts/test_wynd_recovery_leaderboard.py
      - run: PYTHONPATH=scripts python scripts/test_wynd_recovery_snapshots.py
      - run: python scripts/update_wynd_recovery_market.py --root .
      - run: PYTHONPATH=scripts python scripts/update_wynd_recovery_leaderboard.py --root .
      - name: Validate atomic daily snapshot
        run: PYTHONPATH=scripts python scripts/validate_wynd_recovery_snapshots.py --root .
      - name: Persist daily market snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recovery/wynd-market.json data/recovery/wynd-leaderboard.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update WYND recovery market data"
          for attempt in 1 2 3; do
            if git push; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            git pull --rebase origin main
          done
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ github.token }}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
