name: Simulate WYND recovery actions

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/simulate-wynd-recovery.yml"
      - "scripts/simulate_wynd_recovery.py"
      - "scripts/test_wynd_recovery_simulation.py"
      - "data/recovery/wynd-pools.json"

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run unsigned non-broadcast simulations
        id: simulation
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p docs/diagnostics
          set -o pipefail
          PYTHONPATH=scripts python scripts/test_wynd_recovery_simulation.py
          PYTHONPATH=scripts python scripts/simulate_wynd_recovery.py 2>&1 | tee docs/diagnostics/latest_wynd_recovery_simulation.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: wynd-recovery-all-pool-simulation
          path: |
            docs/diagnostics/latest_wynd_recovery_simulation.log
            docs/diagnostics/wynd_recovery_simulation.json
          retention-days: 30
      - name: Fail if simulation failed
        if: always() && steps.simulation.outcome != 'success'
        run: exit 1
