name: Update Map of NETA data
# Manual refresh requested 2026-09-12

on:
  workflow_dispatch:
  push:
    branches: [feature/map-of-neta, main]
    paths:
      - ".github/workflows/update-map-of-neta.yml"
      - "scripts/update_map_of_neta.py"
      - "scripts/test_map_chain_detection.py"
      - "data/map/chains.json"
  schedule:
    - cron: "17 0,6,12,18 * * *"
    - cron: "17 1,7,13,19 * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: update-map-of-neta-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Berlin collection-time gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$(TZ=Europe/Berlin date +%H)" in
            03|09|15|21) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'
      - name: Test multichain route classification
        if: steps.gate.outputs.run == 'true'
        run: python scripts/test_map_chain_detection.py
      - name: Collect and validate new events
        if: steps.gate.outputs.run == 'true'
        run: python scripts/update_map_of_neta.py --root .
      - name: Commit collector state
        if: steps.gate.outputs.run == 'true'
        id: commit_data
        shell: bash
        run: |
          git config user.name "NETA Reborn Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/map
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update Map of NETA event history"
          BRANCH="${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git rebase -X theirs "origin/$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
      - name: Request GitHub Pages rebuild
        if: github.ref == 'refs/heads/main' && steps.commit_data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
