name: Update Map of NETA data

on:
  workflow_dispatch:
  push:
    branches: [feature/map-of-neta, main]
    paths:
      - ".github/workflows/update-map-of-neta.yml"
      - "scripts/update_map_of_neta.py"
      - "map-of-neta.html"
      - "map-of-neta.css"
      - "map-of-neta.js"
      - "index.html"
      - "what-is-neta.html"
      - "neta-dao.html"
  schedule:
    - cron: "17 0,6,12,18 * * *"
    - cron: "17 1,7,13,19 * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: map-of-neta-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Berlin collection-time gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$(TZ=Europe/Berlin date +%H)" in
            03|09|15|21) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.gate.outputs.run == 'true'
      - name: Collect and validate new events
        if: steps.gate.outputs.run == 'true'
        run: python scripts/update_map_of_neta.py --root .
      - name: Commit collector state
        if: steps.gate.outputs.run == 'true'
        id: commit_data
        shell: bash
        run: |
          git config user.name "NETA Reborn Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/map
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update Map of NETA event history"
          BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          git push origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request GitHub Pages rebuild
        if: github.ref == 'refs/heads/main' && steps.commit_data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
