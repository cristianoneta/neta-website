name: Update Map of NETA data

on:
  workflow_dispatch:
  push:
    branches: [feature/map-of-neta]
    paths:
      - ".github/workflows/update-map-of-neta.yml"
      - "scripts/update_map_of_neta.py"

permissions:
  contents: write

concurrency:
  group: map-of-neta-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/map-of-neta
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and validate new events
        run: python scripts/update_map_of_neta.py --root .
      - name: Commit collector state
        shell: bash
        run: |
          git config user.name "NETA Reborn Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/map
          if git diff --cached --quiet; then
            echo "No Map of NETA changes."
            exit 0
          fi
          git commit -m "chore: update Map of NETA event history"
          git fetch origin feature/map-of-neta
          git rebase origin/feature/map-of-neta
          git push origin HEAD:feature/map-of-neta
