name: Diagnose WYND LP ownership

on:
  push:
    branches: [diagnostic/wynd-lp-attribution]
    paths:
      - ".github/workflows/diagnose-wynd-lp.yml"
      - "scripts/diagnose_wynd_lp.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Patch diagnostic parser for composite WYND stake keys
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/diagnose_wynd_lp.py')
          s=p.read_text()
          s=s.replace('HEX_RE=re.compile(r"^[0-9a-fA-F]+$")', 'HEX_RE=re.compile(r"^[0-9a-fA-F]+$")\nADDR_RE=re.compile(rb"juno1[0-9a-z]{38}")')
          s=s.replace('if ns=="staked_balances" and suf:', 'if ns=="stake" and suf:')
          s=s.replace('a=suf.decode(); x=amount_from_obj(obj)', 'm=ADDR_RE.search(suf)\n                if not m: raise ValueError("wallet address not found in stake key")\n                a=m.group(0).decode(); x=amount_from_obj(obj)')
          p.write_text(s)
          PY
      - name: Run WYND LP diagnostic
        run: python scripts/diagnose_wynd_lp.py
      - name: Show WYND LP diagnostic
        if: always()
        run: cat wynd_lp_diagnostic.json || true
