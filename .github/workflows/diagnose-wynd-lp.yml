name: Diagnose WYND LP ownership

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-wynd-lp.yml"
      - "scripts/diagnose_wynd_lp.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run WYND LP diagnostic
        run: python scripts/diagnose_wynd_lp.py
      - name: Show WYND LP diagnostic
        run: cat wynd_lp_diagnostic.json
