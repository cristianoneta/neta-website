name: Diagnose combined LP attribution

on:
  push:
    branches: [diagnostic/wynd-lp-attribution]
    paths:
      - ".github/workflows/diagnose-wynd-lp.yml"
      - "scripts/lp_attribution.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run combined LP attribution
        id: attribution
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p docs/diagnostics
          set +e
          set -o pipefail
          python scripts/lp_attribution.py 2>&1 | tee docs/diagnostics/latest_lp_attribution.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> docs/diagnostics/latest_lp_attribution.log
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Persist diagnostic output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/latest_lp_attribution.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record latest LP attribution diagnostic"
          git push
      - name: Fail workflow when attribution failed
        if: always() && steps.attribution.outputs.exit_code != '0'
        run: exit 1
