name: Diagnose WYND LP ownership

on:
  push:
    branches: [diagnostic/wynd-lp-attribution]
    paths:
      - ".github/workflows/diagnose-wynd-lp.yml"
      - "scripts/diagnose_wynd_lp.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run WYND LP diagnostic
        run: python scripts/diagnose_wynd_lp.py
      - name: Show WYND LP diagnostic
        if: always()
        run: cat wynd_lp_diagnostic.json || true
