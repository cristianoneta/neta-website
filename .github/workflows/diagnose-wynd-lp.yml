name: Diagnose WYND LP ownership

on:
  push:
    branches: [diagnostic/wynd-lp-attribution]
    paths:
      - ".github/workflows/diagnose-wynd-lp.yml"
      - "scripts/diagnose_wynd_lp.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Inspect WYND stake residual structures
        run: |
          python - <<'PY'
          import json, sys
          sys.path.insert(0,'scripts')
          import diagnose_wynd_lp as d
          rows=d.parse_state(d.CUSTODY)
          nonempty=[]
          totals=[]
          for ns,suf,vb,kb in rows:
              obj=d.parse_json(vb)
              if ns=='stake' and isinstance(obj,dict) and obj.get('locked_tokens'):
                  nonempty.append({'key':kb.hex(),'value':obj})
              if ns in ('total_staked','total_per_period'):
                  totals.append({'ns':ns,'key':kb.hex(),'text':vb.decode(errors='replace'),'hex':vb.hex()})
          print(json.dumps({'nonempty_locked_count':len(nonempty),'nonempty_locked_samples':nonempty[:20],'totals':totals},indent=2))
          PY
