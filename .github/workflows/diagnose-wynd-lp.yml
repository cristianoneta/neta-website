name: Diagnose combined LP attribution

on:
  push:
    branches: [diagnostic/wynd-lp-attribution]
    paths:
      - ".github/workflows/diagnose-wynd-lp.yml"
      - "scripts/lp_attribution.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run combined LP attribution
        run: python scripts/lp_attribution.py
