name: Diagnose WYND LP ownership

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-wynd-lp.yml"
      - "scripts/diagnose_wynd_lp.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run WYND LP diagnostic
        run: python scripts/diagnose_wynd_lp.py
      - name: Show WYND LP diagnostic
        run: cat wynd_lp_diagnostic.json
