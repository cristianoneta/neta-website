name: Diagnose Map of NETA events

on:
  workflow_dispatch:
  push:
    branches:
      - feature/map-of-neta
    paths:
      - ".github/workflows/diagnose-map-of-neta.yml"
      - "scripts/diagnose_map_of_neta.py"

permissions:
  contents: write

concurrency:
  group: diagnose-map-of-neta
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover NETA event shapes
        run: python scripts/diagnose_map_of_neta.py
      - name: Persist diagnostic
        shell: bash
        run: |
          git config user.name "NETA Reborn Bot"
          git config user.email "actions@users.noreply.github.com"
          git add map-of-neta-diagnostic.json
          if git diff --cached --quiet; then
            echo "No diagnostic changes."
            exit 0
          fi
          git commit -m "chore: persist Map of NETA event diagnostic"
          git fetch origin feature/map-of-neta
          git rebase origin/feature/map-of-neta
          git push origin HEAD:feature/map-of-neta
