name: NETA Socials contract

on:
  pull_request:
    paths:
      - "contracts/neta-socials/**"
      - ".github/workflows/neta-socials-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/neta-socials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --target wasm32-unknown-unknown --component clippy --profile minimal
      - run: cargo +1.85.0 clippy --all-targets -- -D warnings
      - run: cargo +1.85.0 test
      - run: cargo +1.85.0 build --release --target wasm32-unknown-unknown
