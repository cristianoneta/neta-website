name: NETA Socials contract

on:
  pull_request:
    paths:
      - "contracts/neta-socials/**"
      - ".github/workflows/neta-socials-contract.yml"
  push:
    branches: [main]
    paths:
      - "contracts/neta-socials/**"
      - ".github/workflows/neta-socials-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/neta-socials
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --target wasm32-unknown-unknown --component clippy,rustfmt --profile minimal
      - name: Verify dependency lockfile is current
        run: cargo +1.85.0 metadata --locked --format-version 1 --no-deps >/dev/null
      - name: Audit locked Rust dependencies
        run: |
          cargo +1.85.0 install cargo-audit --version 0.22.1 --locked
          cargo +1.85.0 audit
      - name: Verify formatting
        run: cargo +1.85.0 fmt -- --check
      - name: Verify schemas
        run: cargo +1.85.0 run --locked --example schema
      - name: Run clippy
        run: cargo +1.85.0 clippy --locked --all-targets -- -D warnings
      - name: Run contract tests
        run: cargo +1.85.0 test --locked
      - name: Build release WASM
        run: RUSTFLAGS="-D warnings" cargo +1.85.0 build --locked --release --target wasm32-unknown-unknown
      - name: Build optimized production WASM
        run: |
          docker run --rm \
            -v "$PWD:/code" \
            --mount type=volume,source=neta_socials_cache,target=/target \
            --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
            cosmwasm/optimizer:0.17.0
      - name: Verify optimized WASM checksum
        run: |
          cd artifacts
          sha256sum -c checksums.txt
          cmp neta_socials.wasm ../../../assets/contracts/neta_socials.wasm
      - name: Upload contract verification artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neta-socials-contract
          path: |
            contracts/neta-socials/Cargo.lock
            contracts/neta-socials/schema/
            contracts/neta-socials/artifacts/neta_socials.wasm
            contracts/neta-socials/artifacts/checksums.txt
          if-no-files-found: error
