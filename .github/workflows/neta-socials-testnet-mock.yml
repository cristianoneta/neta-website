name: NETA Socials testnet mock

on:
  pull_request:
    paths:
      - "contracts/neta-socials-stake-mock/**"
      - ".github/workflows/neta-socials-testnet-mock.yml"
  push:
    branches: [main]
    paths:
      - "contracts/neta-socials-stake-mock/**"
      - ".github/workflows/neta-socials-testnet-mock.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/neta-socials-stake-mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.85.0 --target wasm32-unknown-unknown --component clippy,rustfmt --profile minimal
      - name: Generate dependency lockfile
        run: cargo +1.85.0 generate-lockfile
      - name: Verify formatting
        run: cargo +1.85.0 fmt -- --check
      - name: Run clippy
        run: cargo +1.85.0 clippy --all-targets -- -D warnings
      - name: Run tests
        run: cargo +1.85.0 test
      - name: Build warning-free WASM
        run: RUSTFLAGS="-D warnings" cargo +1.85.0 build --release --target wasm32-unknown-unknown
      - name: Build optimized testnet WASM
        run: |
          docker run --rm \
            -v "$PWD:/code" \
            --mount type=volume,source=neta_socials_stake_mock_cache,target=/target \
            --mount type=volume,source=registry_cache,target=/usr/local/cargo/registry \
            cosmwasm/optimizer:0.17.0
      - name: Verify checksum
        run: cd artifacts && sha256sum -c checksums.txt
      - name: Upload testnet artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: neta-socials-stake-mock
          path: |
            contracts/neta-socials-stake-mock/Cargo.lock
            contracts/neta-socials-stake-mock/artifacts/neta_socials_stake_mock.wasm
            contracts/neta-socials-stake-mock/artifacts/checksums.txt
          if-no-files-found: error
