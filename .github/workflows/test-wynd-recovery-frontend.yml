name: Test WYND recovery frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-wynd-recovery-frontend.yml"
      - "scripts/test_wynd_recovery_frontend.py"
      - "wynd-recovery.html"
      - "wynd-recovery.css"
      - "wynd-recovery.js"
      - "data/recovery/wynd-pools.json"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frontend safety tests
        shell: bash
        run: |
          set -o pipefail
          node --check wynd-recovery.js
          python scripts/test_wynd_recovery_frontend.py
