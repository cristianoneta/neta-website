name: Test WYND recovery frontend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-wynd-recovery-frontend.yml"
      - "scripts/test_wynd_recovery_frontend.py"
      - "wynd-recovery.html"
      - "wynd-recovery.css"
      - "wynd-recovery.js"
      - "data/recovery/wynd-pools.json"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run frontend safety tests
        shell: bash
        run: |
          mkdir -p docs/diagnostics
          set -o pipefail
          { node --check wynd-recovery.js && python scripts/test_wynd_recovery_frontend.py; } 2>&1 | tee docs/diagnostics/latest_wynd_recovery_frontend_test.log
      - name: Persist test evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/latest_wynd_recovery_frontend_test.log
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record recovery frontend safety tests"
          git push
