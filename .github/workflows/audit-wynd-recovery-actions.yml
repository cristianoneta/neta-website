name: Audit WYND recovery action schemas

on:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 0"
  pull_request:
    branches: [main]
    paths:
      - "scripts/audit_wynd_recovery_actions.py"
      - "scripts/test_wynd_recovery_action_audit.py"
      - "data/recovery/wynd-pools.json"
      - ".github/workflows/audit-wynd-recovery-actions.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=scripts python scripts/test_wynd_recovery_action_audit.py
      - name: Query all eight allowlisted pools without broadcasting
        run: PYTHONPATH=scripts python scripts/audit_wynd_recovery_actions.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wynd-recovery-action-audit
          path: docs/diagnostics/wynd_recovery_action_audit.json
          retention-days: 30
