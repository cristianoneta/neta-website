name: Update NETA on-chain data
# Schema v3: DAO maturity split, validated LP attribution, and economic custody counts.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-neta-data.yml"
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. These two 6-hour grids cover both CET and CEST.
    # The Berlin-time gate below accepts only 03:00, 09:00, 15:00 and 21:00 local time.
    - cron: "7 0,6,12,18 * * *"
    - cron: "7 1,7,13,19 * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: neta-daily-data-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Berlin update-time gate
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual/PR/production bootstrap run allowed."
            exit 0
          fi
          HOUR="$(TZ=Europe/Berlin date +%H)"
          case "$HOUR" in
            03|09|15|21) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Fetch and validate all NETA data
        if: steps.gate.outputs.run == 'true'
        run: python scripts/run_neta_data.py --output .
      - name: Show validation summary
        if: steps.gate.outputs.run == 'true'
        run: cat metadata.json
      - name: Commit changed data
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request'
        id: commit_data
        shell: bash
        run: |
          if git diff --quiet -- holders.json address_index.json metadata.json data.js address-index.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes."
            exit 0
          fi
          git config user.name "NETA Reborn Bot"
          git config user.email "actions@users.noreply.github.com"
          git add holders.json address_index.json metadata.json data.js address-index.js
          git commit -m "chore: daily NETA on-chain data update"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request GitHub Pages rebuild
        if: steps.gate.outputs.run == 'true' && github.event_name != 'pull_request' && steps.commit_data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
