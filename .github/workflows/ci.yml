name: Test website

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "src/**"
      - "scripts/site_shell.py"
      - "scripts/test_site_integrity.py"
      - "scripts/test_wynd_recovery_frontend.py"
      - "scripts/test_recovery_signing_gate.py"
      - "tests/browser/**"
      - "data/recovery/wynd-pools.json"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "src/**"
      - "scripts/site_shell.py"
      - "scripts/test_site_integrity.py"
      - "scripts/test_wynd_recovery_frontend.py"
      - "scripts/test_recovery_signing_gate.py"
      - "tests/browser/**"
      - "data/recovery/wynd-pools.json"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Verify site and recovery safety gates
        shell: bash
        run: |
          set -o pipefail
          python scripts/test_site_integrity.py
          python scripts/test_wynd_recovery_frontend.py
          python scripts/test_recovery_signing_gate.py
          for file in *.js; do node --check "$file"; done
          npm run build:recovery-signing
          test -s assets/recovery-signing-client.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        run: npm run test:browser
