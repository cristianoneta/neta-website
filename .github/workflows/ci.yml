name: Test website

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "tests/browser/**"
      - "data/recovery/wynd-pools.json"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "assets/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "tests/browser/**"
      - "data/recovery/wynd-pools.json"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/ci.yml"

permissions:
  contents: read
  pages: write

concurrency:
  group: website-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Verify site and recovery safety gates
        shell: bash
        run: |
          set -o pipefail
          python scripts/test_site_integrity.py
          python scripts/test_wynd_recovery_frontend.py
          python scripts/test_recovery_signing_gate.py
          for file in *.js; do node --check "$file"; done
          npm run build:recovery-signing
          test -s assets/recovery-signing-client.js
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
      - name: Verify committed signing bundle is reproducible
        run: git diff --exit-code -- assets/recovery-signing-client.js
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser integration tests
        run: npm run test:browser
      - name: Deploy tested main revision to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          curl --fail-with-body --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${{ github.token }}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
