name: Validate integrated NETA indexer

on:
  push:
    branches: [diagnostic/wynd-lp-attribution]
    paths:
      - ".github/workflows/validate-integrated-indexer.yml"
      - "scripts/update_neta_data.py"
      - "scripts/run_neta_data.py"
      - "scripts/lp_attribution.py"
      - "scripts/validate_integrated_output.py"
      - "app.js"
      - "index.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run integrated schema v3 indexer
        id: indexer
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p diagnostic-output docs/diagnostics
          set +e
          set -o pipefail
          python scripts/run_neta_data.py --output diagnostic-output 2>&1 | tee docs/diagnostics/integrated_indexer.log
          status=${PIPESTATUS[0]}
          if [ "${status}" -eq 0 ]; then
            python scripts/validate_integrated_output.py diagnostic-output 2>&1 | tee -a docs/diagnostics/integrated_indexer.log
            status=${PIPESTATUS[0]}
          fi
          echo "exit_code=${status}" >> docs/diagnostics/integrated_indexer.log
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Persist diagnostic results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/integrated_indexer.log
          if [ -f docs/diagnostics/integrated_indexer_summary.json ]; then
            git add docs/diagnostics/integrated_indexer_summary.json
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record integrated indexer validation"
          git push
      - name: Fail when validation failed
        if: always() && steps.indexer.outputs.exit_code != '0'
        run: exit 1
