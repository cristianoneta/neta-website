name: Diagnose DAO claim maturity

on:
  push:
    branches: [diagnostic/wynd-lp-attribution]
    paths:
      - ".github/workflows/diagnose-dao-claims.yml"
      - "scripts/dao_claim_diagnostic.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Classify DAO claims
        id: claims
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p docs/diagnostics
          set +e
          set -o pipefail
          python scripts/dao_claim_diagnostic.py 2>&1 | tee docs/diagnostics/latest_dao_claims.json
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> docs/diagnostics/latest_dao_claims.json
          echo "exit_code=${status}" >> "${GITHUB_OUTPUT}"
          exit "${status}"
      - name: Persist result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/latest_dao_claims.json docs/diagnostics/dao_claims_by_wallet.csv docs/diagnostics/dao_claims_detail.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record latest DAO claim maturity diagnostic"
          git push
      - name: Fail when diagnostic failed
        if: always() && steps.claims.outputs.exit_code != '0'
        run: exit 1
