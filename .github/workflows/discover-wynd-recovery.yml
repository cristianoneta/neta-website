name: Discover WYND recovery pools

on:
  push:
    branches: [diagnostic/wynd-recovery-discovery]
    paths:
      - ".github/workflows/discover-wynd-recovery.yml"
      - "scripts/discover_wynd_recovery.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Enumerate live WYND pairs
        id: discovery
        continue-on-error: true
        run: python scripts/discover_wynd_recovery.py
      - name: Validate top-five recovery state
        id: validation
        continue-on-error: true
        run: python scripts/validate_wynd_recovery.py
      - name: Persist evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/wynd_recovery_discovery.json docs/diagnostics/wynd_recovery_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record WYND recovery pool discovery"
          git push
      - name: Fail when discovery is incomplete
        if: always() && (steps.discovery.outcome != 'success' || steps.validation.outcome != 'success')
        run: exit 1
