name: Discover WYND recovery pools

on:
  push:
    branches: [diagnostic/wynd-recovery-discovery]
    paths:
      - ".github/workflows/discover-wynd-recovery.yml"
      - "scripts/discover_wynd_recovery.py"
      - "scripts/validate_wynd_recovery.py"
      - "scripts/build_wynd_recovery_registry.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Enumerate live WYND pairs
        id: discovery
        continue-on-error: true
        run: python scripts/discover_wynd_recovery.py
      - name: Validate top-eight recovery state
        id: validation
        continue-on-error: true
        run: python scripts/validate_wynd_recovery.py
      - name: Build top-eight frontend allowlist
        id: registry
        continue-on-error: true
        run: python scripts/build_wynd_recovery_registry.py
      - name: Persist evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/diagnostics/wynd_recovery_discovery.json
          if [ -f docs/diagnostics/wynd_recovery_validation.json ]; then
            git add docs/diagnostics/wynd_recovery_validation.json
          fi
          if [ -f data/recovery/wynd-pools.json ]; then
            git add data/recovery/wynd-pools.json docs/recovery/WYND_RECOVERY_STATE_MACHINE.md
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record WYND recovery pool discovery"
          git push
      - name: Fail when discovery is incomplete
        if: always() && (steps.discovery.outcome != 'success' || steps.validation.outcome != 'success' || steps.registry.outcome != 'success')
        run: exit 1
